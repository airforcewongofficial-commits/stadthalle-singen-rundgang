<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>360°-Rundgang · Stadthalle Singen</title>
<meta name="description" content="Virtueller 360°-Rundgang durch die Stadthalle Singen: Foyer, Thüga Saal, Empore, Workshop- und Seminarräume.">
<meta name="robots" content="noindex">
<meta property="og:title" content="360°-Rundgang · Stadthalle Singen">
<meta property="og:description" content="Foyer, Thüga Saal, Empore, Workshop- und Seminarräume in 360°.">
<meta property="og:image" content="img/aussenansicht.jpg">
<meta name="theme-color" content="#0B0A0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2389146A%22/%3E%3Crect x=%224%22 y=%2212%22 width=%228%22 height=%222%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preload" href="fonts/montserrat-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/montserrat-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/pannellum.css">
<style>
/* Schrift lokal eingebunden (keine Verbindung zu Google-Servern) */
@font-face{font-family:"Montserrat";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/montserrat-latin-800-normal.woff2) format("woff2")}

/* Style M „Magenta/Schwarz“ – Werte aus dem Style-Sheet des Imagevideos */
:root{
  --magenta:#89146A;
  --black:#0B0A0B;
  --white:#FFFFFF;
  --panel:rgba(11,10,11,.65);
  --panel-strong:rgba(11,10,11,.82);
  --icon:rgba(255,255,255,.85);
  --unit:rgba(255,255,255,.65);
  --line:rgba(255,255,255,.16);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --gb:max(14px, env(safe-area-inset-bottom, 0px));
  --gt:max(14px, env(safe-area-inset-top, 0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--black);color:var(--white);font-family:"Montserrat",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

#app{position:fixed;inset:0;overflow:hidden;background:var(--black)}
#pano{position:absolute;inset:0}
#pano .pnlm-container{background:var(--black);font-family:"Montserrat",sans-serif}
#pano .pnlm-controls-container,#pano .pnlm-about-msg,#pano .pnlm-load-box,#pano .pnlm-panorama-info{display:none!important}
#pano .pnlm-info-box{background:var(--panel-strong);border-radius:0;font-family:"Montserrat",sans-serif}

/* ---------- Typo-Bausteine ---------- */
.kicker{margin:0;font-weight:600;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--white)}
.title{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.underline{display:block;height:6px;width:96px;background:var(--magenta);transform-origin:left center}

/* ---------- Banner (wie Raum-Callouts im Film) ---------- */
.banner{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:stretch}
.banner .lam{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--white);width:var(--lamw,54px)}
.banner .lam i{background:var(--magenta);transform-origin:center;display:block}
.banner .panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:var(--pad,18px 22px 20px 22px);display:grid;gap:10px;align-content:start;min-width:0;transform-origin:left center}
.banner .edge{position:absolute;left:0;right:0;bottom:-6px;height:6px;background:var(--magenta);transform-origin:left center}
.banner .lam{border-left:2px solid var(--magenta)}

/* Einstiegsanimation (Mechanik des Film-Banners, verkürzt) */
.banner.anim .edge{animation:edgeIn .34s var(--ease-out) both}
.banner.anim .lam i{animation:lamOpen .4s var(--ease-out) both .2s}
.banner.anim .panel{animation:panelIn .5s var(--ease-out) both .28s}
.banner.anim .title{animation:rise .46s var(--ease-out) both .42s}
.banner.anim .kicker{animation:rise .4s var(--ease-out) both .52s}
.banner.anim .underline{animation:draw .4s var(--ease-out) both .6s}
.banner.anim .stagger > *{animation:fadeUp .4s var(--ease-out) both}
.banner.anim .stagger > *:nth-child(1){animation-delay:.66s}
.banner.anim .stagger > *:nth-child(2){animation-delay:.74s}
.banner.anim .stagger > *:nth-child(3){animation-delay:.82s}
.banner.anim .stagger > *:nth-child(4){animation-delay:.9s}
.banner.anim .stagger > *:nth-child(5){animation-delay:.98s}
@keyframes edgeIn{from{transform:scaleX(0)}to{transform:none}}
@keyframes lamOpen{from{transform:scaleX(0)}to{transform:none}}
@keyframes panelIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Startseite ---------- */
.cover{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-start;background:var(--black);transition:opacity .5s ease,visibility .5s}
.cover.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 50%}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(11,10,11,.35) 0%,rgba(11,10,11,0) 45%);z-index:1}
.cover-inner{position:relative;z-index:2;width:100%;padding:calc(var(--gt) + 18px) calc(var(--gr) + 110px) 0 calc(var(--gl) + 14px)}
@media (max-width:600px){.cover-inner{padding:calc(var(--gt) + 52px) var(--gr) 0 var(--gl)}}
.cover .banner{max-width:720px;width:max-content;--lamw:48px;--pad:clamp(14px,2.6vh,22px) 26px clamp(16px,2.8vh,24px) 24px}
.cover .panel{gap:clamp(6px,1.2vh,10px)}
.cover .kicker{font-size:.78rem}
.cover .title{font-size:clamp(1.7rem,min(4.2vw,6.4vh),3.2rem);white-space:nowrap}
.cover .underline{width:clamp(80px,9vw,128px);height:clamp(6px,.7vw,9px)}
.cover-text{margin:2px 0 0;max-width:60ch;font-size:.92rem;line-height:1.5;color:rgba(255,255,255,.9)}
.cover-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:6px}
.cover .btn{padding:clamp(11px,1.8vh,15px) 20px}
.btn{appearance:none;border:0;border-radius:0;background:var(--magenta);color:var(--white);font-weight:700;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;padding:16px 22px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;transition:background-color .2s ease,transform .2s ease}
.btn:hover{background:#9f1a7c}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;flex:none}
.credit{font-size:.74rem;letter-spacing:.06em;color:rgba(255,255,255,.7)}
.credit b{font-weight:700;color:var(--white)}
.draft-tag{position:absolute;z-index:3;top:var(--gt);right:var(--gr);font-weight:600;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;background:var(--panel);padding:8px 12px;border-bottom:3px solid var(--magenta)}

/* ---------- Szenen-Titel oben links ---------- */
.place{position:absolute;z-index:6;top:var(--gt);left:var(--gl);max-width:calc(100% - var(--gl) - var(--gr) - 120px);pointer-events:none}
.place .banner{--lamw:22px;--pad:11px 16px 12px 14px}
.place .banner .lam{gap:1px}
.place .kicker{font-size:.6rem}
.place .title{font-size:clamp(1.02rem,2.6vw,1.35rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place .underline{width:44px;height:4px}
.place .banner .edge{height:4px;bottom:-4px}

/* ---------- Werkzeugleiste oben rechts ---------- */
.tools{position:absolute;z-index:6;top:var(--gt);right:var(--gr);display:flex;gap:6px}
.tool{appearance:none;width:44px;height:44px;border:0;border-radius:0;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;position:relative;transition:background-color .2s ease}
.tool svg{width:20px;height:20px;color:var(--icon)}
.tool:hover{background:var(--panel-strong)}
.tool[aria-pressed="true"]{background:var(--magenta)}
.tool[aria-pressed="true"] svg{color:var(--white)}

/* ---------- Standort-Leiste unten ---------- */
.strip{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:28px 0 var(--gb);background:linear-gradient(0deg,rgba(11,10,11,.75),rgba(11,10,11,0))}
.strip-row{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 var(--gr) 8px var(--gl);scrollbar-width:none}
.strip-row::-webkit-scrollbar{display:none}
.card{appearance:none;flex:0 0 auto;width:132px;border:0;border-radius:0;padding:0;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;text-align:left;scroll-snap-align:start;position:relative;display:grid}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.75;transition:opacity .2s ease}
.card span{display:block;padding:7px 9px 9px;font-weight:600;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.8)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--magenta);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-out)}
.card:hover img{opacity:1}
.card[aria-current="true"] img{opacity:1}
.card[aria-current="true"] span{color:var(--white)}
.card[aria-current="true"]::after{transform:none}
.card:focus-visible{outline:3px solid var(--white);outline-offset:-3px}
@media (min-width:900px){.strip-row{justify-content:center}.card{width:148px}}

/* ---------- Hinweis ---------- */
.hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:3px solid var(--magenta);font-weight:600;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;pointer-events:none;transition:opacity .6s ease,visibility .6s}
.hint svg{width:20px;height:20px;flex:none}
.hint.is-gone{opacity:0;visibility:hidden}

/* ---------- Raum-Info (Banner-Sheet) ---------- */
.sheet{position:absolute;z-index:12;left:var(--gl);right:var(--gr);bottom:calc(var(--strip-h,170px) + 6px);display:flex;pointer-events:none;visibility:hidden}
.sheet.is-open{visibility:visible}
.sheet .banner{pointer-events:auto;width:100%;max-width:560px;--lamw:46px;--pad:18px 20px 20px 20px}
.sheet .title{font-size:clamp(1.5rem,4.4vw,2.1rem);padding-right:40px}
.sheet-text{margin:2px 0 0;font-size:.9rem;line-height:1.55;color:rgba(255,255,255,.9);max-width:58ch}
.specs{display:flex;flex-wrap:wrap;gap:10px 26px;margin:6px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.spec{display:flex;align-items:center;gap:9px}
.spec svg{width:24px;height:24px;color:var(--icon);flex:none}
.spec b{font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.spec small{font-weight:400;font-size:.8rem;color:var(--unit);margin-left:3px}
.feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.feat{display:inline-flex;align-items:center;gap:8px;padding:7px 10px 7px 8px;background:rgba(255,255,255,.08);border-left:3px solid var(--magenta);font-weight:600;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase}
.feat svg{width:18px;height:18px;color:var(--icon)}
.sheet-note{margin:0;font-size:.7rem;color:var(--unit)}
.sheet-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border:0;border-radius:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.sheet-close svg{width:18px;height:18px;color:var(--icon)}
.sheet-close:hover{background:rgba(255,255,255,.08)}
.sheet .btn{justify-self:start;padding:12px 16px;font-size:.72rem}
@media (max-width:600px){
  .sheet .banner{--lamw:26px;--pad:16px 16px 16px 16px}
  .sheet .panel{max-height:52vh;overflow:auto}
  .card{width:104px}
  .card span{font-size:.56rem;letter-spacing:.08em;padding:6px 7px 8px}
  .hint{white-space:normal;text-align:center;max-width:84vw;font-size:.62rem;letter-spacing:.12em}
  .cover .btn{font-size:.74rem;letter-spacing:.1em;padding:14px 18px}
  .cover .banner{--lamw:30px;--pad:16px 18px 18px 18px;width:auto}
  .cover .title{white-space:normal}
  .cover-text,.cover .credit{display:none}
}

/* ---------- Hotspots ---------- */
.hs{cursor:pointer;outline:none}
.hs-info{width:30px;height:30px;border-radius:50%;background:rgba(137,20,106,.9);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 3px 12px rgba(0,0,0,.4)}
.hs-info::before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);background:
  linear-gradient(var(--white),var(--white)) center/12px 2px no-repeat,
  linear-gradient(var(--white),var(--white)) center/2px 12px no-repeat}
.hs-info::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--magenta);opacity:0;animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}70%,100%{transform:scale(1.35);opacity:0}}
.hs-label{position:absolute;left:40px;top:50%;transform:translateY(-50%);white-space:nowrap;font-weight:600;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--white);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:7px 10px 7px 10px;border-left:3px solid var(--magenta);pointer-events:none}
.hs-nav{width:54px;height:54px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px rgba(255,255,255,.85),0 6px 18px rgba(0,0,0,.4);transition:background-color .2s ease}
.hs-nav::before{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;border-left:3px solid var(--white);border-top:3px solid var(--white);transform:translate(-50%,-25%) rotate(45deg)}
.hs-nav:hover{background:var(--magenta)}
.hs-nav .hs-label{left:50%;top:calc(100% + 10px);transform:translateX(-50%);border-left:0;border-bottom:3px solid var(--magenta)}
.hs:focus-visible{box-shadow:0 0 0 3px var(--white),0 0 0 6px var(--magenta)}
:where(button):focus-visible{outline:3px solid var(--white);outline-offset:2px}

/* ---------- Lamellen-Übergang ---------- */
.lamellae{position:absolute;inset:0;z-index:20;display:grid;pointer-events:none}
.lamellae i{font-style:normal;display:block;background:var(--magenta);transform:scaleX(0);transform-origin:left center}
.lamellae.is-closed i{transform:none;transition:transform .32s cubic-bezier(.65,0,.35,1)}
.lamellae.is-opening i{transform:scaleX(0);transform-origin:right center;transition:transform .36s cubic-bezier(.65,0,.35,1)}
.lamellae .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:600;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;opacity:0;transition:opacity .2s ease}
.lamellae.is-loading .loading{opacity:.85}
#swipe{grid-template-columns:repeat(6,1fr)}

/* Opener: fünf Lamellen wie im Film (Raster 375/374/422/374/375) */
#opener{grid-template-columns:375fr 374fr 422fr 374fr 375fr;gap:0}
#opener i{position:relative;display:grid;place-items:center;border-right:2px solid rgba(255,255,255,.85)}
#opener i:last-child{border-right:0}
#opener .word{display:grid;justify-items:center;gap:clamp(8px,1.4vh,14px);opacity:0;transition:opacity .3s ease .15s;text-align:center}
#opener.is-closed .word{opacity:1}
#opener.is-opening .word{opacity:0;transition-delay:0s}
#opener .word b{font-weight:800;font-size:clamp(.9rem,2.1vw,2rem);letter-spacing:-.01em;line-height:1}
#opener .word u{display:block;width:clamp(28px,3.4vw,56px);height:clamp(3px,.45vw,6px);background:var(--white)}
#opener .center b{font-size:clamp(1rem,2.8vw,2.6rem)}
@media (max-width:640px){#opener i:not(.center) .word{display:none}#opener .center b{font-size:3.3vw}}

.error{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:rgba(255,255,255,.7)}

@media (prefers-reduced-motion:reduce){
  .banner.anim *,.hs-info::after{animation:none!important}
  .lamellae i,.cover,.card::after{transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="pano" aria-label="360-Grad-Panorama"></div>

  <header class="place" aria-live="polite">
    <div class="banner" id="placeBanner">
      <div class="lam" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="panel">
        <p class="kicker" id="placeKicker">Erdgeschoss</p>
        <h1 class="title" id="placeTitle">Foyer</h1>
        <span class="underline" aria-hidden="true"></span>
      </div>
      <span class="edge" aria-hidden="true"></span>
    </div>
  </header>

  <div class="tools">
    <button class="tool" type="button" id="btnGyro" aria-pressed="false" aria-label="Mit Handy-Bewegung umsehen" title="Bewegungssteuerung" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="1.5"/><path d="M3 8.5c-1.3 2.2-1.3 4.8 0 7M21 8.5c1.3 2.2 1.3 4.8 0 7"/></svg>
    </button>
    <button class="tool" type="button" id="btnFull" aria-pressed="false" aria-label="Vollbild" title="Vollbild">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12h8M5 9l-3 3 3 3M19 9l3 3-3 3"/></svg>
    Ziehen zum Umsehen · Punkte antippen
  </div>

  <nav class="strip" aria-label="Standorte">
    <div class="strip-row" id="strip"></div>
  </nav>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="banner" role="dialog" aria-labelledby="sheetTitle" id="sheetBanner">
      <div class="lam" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="panel">
        <p class="kicker" id="sheetKicker"></p>
        <h2 class="title" id="sheetTitle"></h2>
        <span class="underline" aria-hidden="true"></span>
        <div class="stagger">
          <p class="sheet-text" id="sheetText"></p>
          <div class="specs" id="sheetSpecs"></div>
          <div class="feats" id="sheetFeats"></div>
          <p class="sheet-note" id="sheetNote"></p>
          <button class="btn" type="button" id="sheetAction" hidden></button>
        </div>
      </div>
      <span class="edge" aria-hidden="true"></span>
      <button class="sheet-close" type="button" id="sheetClose" aria-label="Schließen">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
  </section>

  <div class="lamellae" id="swipe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><span class="loading">Lädt …</span></div>

  <div class="lamellae" id="opener" aria-hidden="true">
    <i><span class="word"><b>Messe</b><u></u></span></i>
    <i><span class="word"><b>Kongress</b><u></u></span></i>
    <i class="center"><span class="word"><b>Stadthalle</b><u></u><b>Singen</b></span></i>
    <i><span class="word"><b>Theater</b><u></u></span></i>
    <i><span class="word"><b>Event</b><u></u></span></i>
  </div>

  <section class="cover" id="cover">
    <img class="cover-img" src="img/aussenansicht.jpg" alt="Die Stadthalle Singen von oben, im Hintergrund der Hohentwiel" width="2576" height="1449">
    <span class="draft-tag">Entwurf</span>
    <div class="cover-inner">
      <div class="banner anim">
        <div class="lam" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="panel">

      scenes: scenes
    });
    viewer.on('scenechange', function (id) { updatePlace(id); markScene(id); });
    viewer.on('load', function () {
      if (pendingOpen) { var f = pendingOpen; pendingOpen = null; f(); }
    });
    viewer.on('error', function () {
      if (pendingOpen) { var f = pendingOpen; pendingOpen = null; f(); }
      busy = false;
    });
    viewer.on('orientationchange', function () {});
    updatePlace(first);
    markScene(first);
  }

  /* Info-Banner immer über der Standort-Leiste halten */
  var stripEl = document.querySelector('.strip');
  function syncStrip() { document.documentElement.style.setProperty('--strip-h', stripEl.offsetHeight + 'px'); }
  syncStrip();
  window.addEventListener('resize', syncStrip);
  if (window.ResizeObserver) new ResizeObserver(syncStrip).observe(stripEl);

  markScene('cover');
})();
</script>
</body>
</html>
